<script>
  (function() {
    console.log('[HTML Injector] Initializing script for inj_v4m8_overlay');

    function initOverlayScript() {
      const overlay = document.getElementById('inj_v4m8_overlay');
      if (!overlay) {
        console.warn('[HTML Injector] inj_v4m8_overlay not found in DOM');
        return;
      }

      const closeBtn = overlay.querySelector('.inj_v4m8_close_btn');
      const secBtn = overlay.querySelector('.inj_v4m8_btn_sec');
      const confirmBtn = document.getElementById('inj_v4m8_btn_confirm');

      function hideOverlay(reason) {
        console.log(`[HTML Injector ⚡] Hiding overlay modal (Reason: ${reason})`);
        overlay.classList.add('hidden');
        overlay.style.setProperty('display', 'none', 'important');
      }

      if (closeBtn) {
        closeBtn.onclick = function(e) {
          e.stopPropagation();
          hideOverlay('X Button clicked');
        };
      }

      if (secBtn) {
        secBtn.onclick = function(e) {
          e.stopPropagation();
          hideOverlay('Secondary Close Button clicked');
        };
      }

      if (confirmBtn) {
        confirmBtn.onclick = function(e) {
          e.stopPropagation();
          console.log('[HTML Injector ⚡] Emerald confirm button clicked');
          alert('에메랄드 모달 확인 버튼 클릭!');
        };
      }

      overlay.onclick = function(e) {
        if (e.target === overlay) {
          hideOverlay('Backdrop background clicked');
        }
      };

      console.log('[HTML Injector ⚡] Click handlers successfully attached to X button and overlay (inj_v4m8)!');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initOverlayScript);
    } else {
      initOverlayScript();
    }
  })();
</script>
